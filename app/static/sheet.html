<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobsta books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600&display=swap">
<style>
:root{
  --bg:#FAFAF7; --surface:#F2F1EC; --fg:#151513; --muted:#5E5D58; --line:#DAD9D3; --line-strong:#B9B8B1;
  --red:#B8321A; --new:#F7E9E4;
  --body:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --head:"Schibsted Grotesk","IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --ease:cubic-bezier(.2,0,0,1);
}
*,*::before,*::after{box-sizing:border-box;border-radius:0 !important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line)}
.mark{font-family:var(--head);font-weight:600;font-size:20px}
.biz{color:var(--muted);font-size:14px;flex:1}
.seg{display:flex}
.seg button{height:40px;min-width:48px;padding:0 12px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;font:inherit;font-size:14px;color:inherit}
.seg button+button{border-left:0}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sum{display:flex;gap:48px;padding:32px 24px 24px;flex-wrap:wrap}
.sum div{display:flex;flex-direction:column}
.sum b{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.02em}
.sum span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media (min-width:1024px){.grid{grid-template-columns:minmax(0,3fr) minmax(260px,1fr)}.grid>section+section{border-left:1px solid var(--line)}}
section{padding:24px;min-width:0}
h2{font-family:var(--head);font-weight:600;font-size:20px;margin:0}
.note{color:var(--muted);font-size:14px;margin:4px 0 16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px}
th{font-size:13px;font-weight:500;color:var(--muted);text-align:left;padding:0 12px 8px 0;border-bottom:1px solid var(--fg);white-space:nowrap}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td.sup{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right;font-variant-numeric:tabular-nums}
th:last-child,td:last-child{padding-right:0}
.desc{color:var(--muted)}
tr.new td{background:var(--new)}
@media (prefers-reduced-motion:no-preference){tr.new td{animation:fade 6s var(--ease) forwards}}
@keyframes fade{0%,40%{background:var(--new)}100%{background:transparent}}
.low{color:var(--red);font-weight:600}
.empty{padding:24px 0;color:var(--muted)}
.foot{color:var(--muted);font-size:14px;padding:16px 24px 32px;border-top:1px solid var(--line);margin:0}
</style>
</head>
<body>
<header class="top">
  <div class="mark">Lobsta</div><div class="biz" id="biz"></div>
  <div class="seg" id="langs" role="group" aria-label="Language">
    <button data-l="zh" lang="zh">中文</button><button data-l="en" lang="en">EN</button><button data-l="fr" lang="fr">FR</button>
  </div>
  <a id="back"></a>
</header>
<div class="sum">
  <div><b id="inv">0</b><span id="invL"></span></div>
  <div><b id="tot">$0</b><span id="totL"></span></div>
</div>
<div class="grid">
  <section><h2 id="pH"></h2><p class="note" id="pN"></p><div class="scroll">
    <table><thead><tr id="pHead"></tr></thead><tbody id="rows"></tbody></table>
    <div class="empty" id="empty" hidden></div></div></section>
  <section><h2 id="sH"></h2><p class="note" id="sN"></p>
    <table><thead><tr id="sHead"></tr></thead><tbody id="stock"></tbody></table>
    <div class="empty" id="noStock" hidden></div></section>
</div>
<p class="foot" id="foot"></p>
<script>
const T = {
 zh:{inv:"张单子已入账",tot:"进货总额",p:"进货记录",pn:"老板在手机上确认后，由程序写入。",s:"库存",sn:"根据盘点和用量估算。",
     cols:["日期","供应商","货品","单子原文","数量","单价","金额","成本"],scols:["货品","现有","够几天"],
     empty:"还没有入账。在手机上确认一张单子。",nostock:"还没有盘点。",back:"手机页面",
     sheet:"同步到老板的 Google 表格：",open:"打开",local:"本地存储。设置 LOBSTA_SHEET_ID 可同步到 Google 表格。"},
 en:{inv:"invoices saved",tot:"purchases recorded",p:"Purchases",pn:"Written by code after the owner confirms on the phone.",s:"Stock",sn:"From closing counts and daily use.",
     cols:["Date","Supplier","Item","As printed","Qty","Price","Total","Cost"],scols:["Item","On hand","Days left"],
     empty:"Nothing saved yet. Confirm an invoice on the phone.",nostock:"No counts yet.",back:"Phone page",
     sheet:"Mirrored to the owner's Google Sheet: ",open:"open it",local:"Local store. Set LOBSTA_SHEET_ID to mirror every confirmed invoice to a Google Sheet."},
 fr:{inv:"factures enregistrées",tot:"achats enregistrés",p:"Achats",pn:"Écrits par le code après confirmation sur le téléphone.",s:"Stock",sn:"D'après les comptages et la consommation.",
     cols:["Date","Fournisseur","Article","Tel qu'imprimé","Qté","Prix","Total","Coût"],scols:["Article","En stock","Jours"],
     empty:"Rien d'enregistré. Confirmez une facture sur le téléphone.",nostock:"Aucun comptage.",back:"Page téléphone",
     sheet:"Copié dans la feuille Google du propriétaire : ",open:"ouvrir",local:"Stockage local. Définissez LOBSTA_SHEET_ID pour copier chaque facture dans Google Sheets."}
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const params = new URLSearchParams(location.search), P = params.get("p") || "";
const store = {get(k){try{return localStorage.getItem(k)}catch(_){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
let lang = params.get("lang") || params.get("l") || store.get("lobsta.lang") || "", L = null, seen = null;
const qs = () => { const u = new URLSearchParams(); if (P) u.set("p", P); if (lang) u.set("lang", lang); return "?" + u; };
const m = v => v == null ? "" : lang === "fr"
  ? Number(v).toLocaleString("fr-CA", {minimumFractionDigits:2, maximumFractionDigits:2}) + " $"
  : "$" + Number(v).toLocaleString("en-CA", {minimumFractionDigits:2, maximumFractionDigits:2});
function labels(){
  L = T[lang] || T.en;
  document.documentElement.lang = lang === "zh" ? "zh-CN" : (lang || "en");
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  $("invL").textContent = L.inv; $("totL").textContent = L.tot;
  $("pH").textContent = L.p; $("pN").textContent = L.pn; $("sH").textContent = L.s; $("sN").textContent = L.sn;
  $("pHead").innerHTML = L.cols.map((c, i) => `<th class="${i >= 4 ? "r" : ""}">${esc(c)}</th>`).join("");
  $("sHead").innerHTML = L.scols.map((c, i) => `<th class="${i ? "r" : ""}">${esc(c)}</th>`).join("");
  $("empty").textContent = L.empty; $("noStock").textContent = L.nostock;
  $("back").textContent = L.back; $("back").href = "/" + (P ? "?p=" + encodeURIComponent(P) + "&l=" + lang : "?l=" + lang);
}
$("langs").onclick = e => { const b = e.target.closest("button"); if (!b) return; lang = b.dataset.l; store.set("lobsta.lang", lang); labels(); tick(); };
async function tick(){
  try {
    const j = await (await fetch("/api/sheet" + qs())).json();
    if (!lang) { lang = j.language || "en"; }
    if (!L || L !== (T[lang] || T.en)) labels();
    $("biz").textContent = j.business || "";
    $("inv").textContent = j.invoices; $("tot").textContent = m(j.total);
    const ids = new Set(j.rows.map(r => r.invoice_id));
    $("rows").innerHTML = j.rows.map(r =>
      `<tr class="${seen && !seen.has(r.invoice_id) ? "new" : ""}"><td style="font-variant-numeric:tabular-nums">${esc(r.date)}</td><td class="sup">${esc(r.supplier)}</td>
       <td>${esc(r.item)}</td><td class="desc">${esc(r.description)}</td>
       <td class="r">${r.quantity ?? ""} ${esc(r.unit || "")}</td><td class="r">${m(r.unit_price)}</td><td class="r">${m(r.line_total)}</td>
       <td class="r">${r.unit_cost != null ? m(r.unit_cost) + "/" + esc(r.cost_per) : ""}</td></tr>`).join("");
    $("empty").hidden = j.rows.length > 0;
    if (seen === null || [...ids].some(i => !seen.has(i))) setTimeout(() => { seen = ids; }, seen === null ? 0 : 6000);
    $("stock").innerHTML = j.stock.map(s =>
      `<tr><td>${esc(s.item)}</td><td class="r">${s.on_hand} ${esc(s.unit)}</td><td class="r ${s.days_left != null && s.days_left < 3 ? "low" : ""}">${s.days_left ?? ""}</td></tr>`).join("");
    $("noStock").hidden = j.stock.length > 0;
    $("foot").innerHTML = j.sheet_url ? `${esc(L.sheet)}<a href="${esc(j.sheet_url)}" target="_blank">${esc(L.open)}</a>` : esc(L.local);
  } catch (_) {}
}
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
